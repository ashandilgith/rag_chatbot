<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automart PH - AI Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1a56db; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f9fafb; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; }
        .user-msg { background: #1a56db; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #e5e7eb; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
        .system-msg { background: #fef08a; color: #854d0e; align-self: center; font-size: 0.85rem; text-align: center; border-radius: 16px; padding: 8px 16px; }
        .input-area { padding: 16px; background: white; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #1a56db; }
        button { background: #1a56db; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1e40af; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Automart Support</div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-msg">Hi! I'm the Automart AI assistant. How can I help you with your vehicle search today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Generate a simple mock user ID for this session
    const sessionId = "user_" + Math.random().toString(36).substring(7);
    const chatBox = document.getElementById("chat-box");
    const inputField = document.getElementById("user-input");

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        // 1. Display User Message
        appendMessage(text, "user-msg");
        inputField.value = "";

        // 2. Add a loading state
        const loadingId = appendMessage("Thinking...", "bot-msg");

        try {
            // 3. Call our FastAPI Backend
            const response = await fetch("https://ideal-broccoli-r4rgxv56qj46f545p-8000.app.github.dev/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_id: sessionId,
                    message: text
                })
            });

            
            

            const data = await response.json();
            
            // Remove loading message
            document.getElementById(loadingId).remove();

            // 4. Handle the Logic based on our Agent's routing decision
            if (data.action === "route_to_human") {
                appendMessage(data.response, "system-msg");
                // In a real app, this is where we trigger the live-agent websocket
            } else {
                appendMessage(data.response, "bot-msg");
            }

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("Error connecting to server. Is the API running?", "system-msg");
            console.error(error);
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        
        // Generate a unique ID so we can remove loading states later
        const msgId = "msg_" + Date.now();
        msgDiv.id = msgId;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        return msgId;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
